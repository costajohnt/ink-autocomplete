name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      # xo crashes under Node 20 (bundled eslint-plugin-ava bug), so lint runs on Node 22 only.
      - run: npm run lint
        if: matrix.node-version == 22
      - run: npm test
